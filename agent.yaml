agent:
  id: "smoketest"
  team: "platform-eng"
  runtime: aks
  interaction_model: "standalone"
  guardrail_profile: "strict"

identity:
  sp_client_id: "fe64120f-e2ac-48d5-98ef-8f86f46cc84e"
  keyvault_url: "https://kv-agenticdemo-poc.vault.azure.net/"

tools: []

evaluation:
  suite: default-strict
  ci_gate: true
  pass_threshold: 0.95
  datasets:
    - id: golden-dataset
      version: v1.0
      source: repo
      path: evals/datasets/golden-dataset.json

output_policy:
  violation_threshold: 4
  window_minutes: 1
  action: block
  notify_webhook: 

prompts:
  active_version: v1.0
  source: prompts/system.txt
